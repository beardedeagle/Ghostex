[package]
name = "ghostex-gpui-mobile-chat"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# The crate root is this folder, which stands in for `apps/desktop/src/` (see `lib.rs`, "Layout").
[lib]
path = "lib.rs"
crate-type = ["rlib"]

[dependencies]
gpui.workspace = true
# CDXC:Mobile 2026-09-27 DECISION: the phone colours fenced code for a small set of languages only: Bash, Rust, TypeScript, JavaScript, Python, JSON (the base `tree-sitter` feature) and diff. User: "9c", picking that set over all 35 desktop grammars (about 36 MB of parse tables in the phone library) or none. A fence in any other language draws as plain monospaced text, which is how the phone showed every code block before. The desktop keeps every grammar (the CDXC:SessionChat note on its gpui-component line).
gpui-component = { path = "../../../.dependencies/gpui-component/crates/component", features = [
    "tree-sitter-bash",
    "tree-sitter-diff",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
gpui-component-assets = { package = "gpui-kit-assets", path = "../../../.dependencies/gpui-component/crates/assets" }
# `debug-embed`: a phone cannot read the repository at run time, so a debug build carries its files too.
rust-embed = { version = "8.7.2", features = ["debug-embed", "include-exclude"] }
ghostex-client-storage = { path = "../../../packages/client-storage-native" }
ghostex-gx-chat-core = { path = "../../../packages/gx-chat-core" }
ghostex-gx-chat-client = { path = "../../../packages/gx-chat-client" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4.45"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
instant = "0.1"
log = "0.4"
raw-window-handle = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
web-time = "1"
# The transcript's Mermaid diagrams (app/native_chat/mermaid_render.rs), drawn by the renderer the desktop's Docs view and chat use.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# A cdylib that keeps the public API alive, to measure what the chat adds to a phone library.
[[example]]
name = "size_probe"
crate-type = ["cdylib"]

# The macOS preview (`examples/preview.rs`) opens a phone-sized window on the desktop platform.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
