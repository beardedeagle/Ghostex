# CDXC:SessionChat 2026-10-23 DECISION:
# User picked "Hidden browser view on the phone" (Q26), superseding the 2026-09-21 decision (answer 1b) that the phone runs the core through these UniFFI bindings: the phone now runs the same core as WebAssembly in a hidden WebView (packages/gx-chat-wasm, apps/mobile/app/src/chat/rust/wasm-core/bridge.ts), shipped over the air. The native React Native views are unchanged. One app release carries both brains behind Settings > Chat > Chat brain (Q27); this crate leaves the app in the release after, together with the GPUI-on-phone experiment (Q28).
# Until then this crate is the built-in brain's binding and nothing else: it wraps `packages/gx-chat-core`'s `ChatCore` behind a handful of calls with JSON strings at the boundary, so the UniFFI surface stays tiny and the core's own types never have to become FFI types. No chat rules live here; a rule the phone needs goes into gx-chat-core. The Expo module `apps/mobile/app/modules/gx-chat-core/` calls it synchronously over JSI. Build with `build.sh` in this folder.
[package]
name = "ghostex-gx-chat-mobile"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gx_chat_mobile"
path = "src/lib.rs"
# staticlib for the iOS XCFramework, cdylib for Android's JNA and for bindgen's library mode.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# The JSON layer over gx-chat-core, shared with the WebAssembly build (packages/gx-chat-wasm).
ghostex-gx-chat-json = { path = "../gx-chat-json" }
uniffi = "0.32"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
# Panics must unwind: every exported call catches them and answers a JSON error instead of
# tearing the app down.
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
